<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .game-container {
      text-align: center;
    }

    h1 {
      margin-bottom: 10px;
      color: #4caf50;
    }

    .info {
      margin-bottom: 12px;
      font-size: 18px;
    }

    canvas {
      background: #1b1b1b;
      border: 3px solid #4caf50;
      border-radius: 8px;
      max-width: 90vw;
      max-height: 90vw;
    }

    .buttons {
      margin-top: 15px;
    }

    button {
      padding: 10px 18px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #4caf50;
      color: white;
      font-weight: bold;
    }

    button:hover {
      background: #43a047;
    }

    .hint {
      margin-top: 10px;
      color: #bbb;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="game-container">
    <h1>Snake 🐍</h1>
    <div class="info">
      Wynik: <span id="score">0</span>
    </div>
    <canvas id="game" width="400" height="400"></canvas>
    <div class="buttons">
      <button id="restartBtn">Restart</button>
    </div>
    <div class="hint">
      Sterowanie: strzałki lub W A S D
    </div>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const restartBtn = document.getElementById("restartBtn");

    const tileSize = 20;
    const tileCount = canvas.width / tileSize;

    let snake;
    let food;
    let dx;
    let dy;
    let score;
    let gameOver;
    let gameStarted;

    function initGame() {
      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];

      food = randomFoodPosition();
      dx = 1;
      dy = 0;
      score = 0;
      gameOver = false;
      gameStarted = true;
      scoreEl.textContent = score;
    }

    function randomFoodPosition() {
      let newFood;
      let valid = false;

      while (!valid) {
        newFood = {
          x: Math.floor(Math.random() * tileCount),
          y: Math.floor(Math.random() * tileCount)
        };

        valid = !snake || !snake.some(part => part.x === newFood.x && part.y === newFood.y);
      }

      return newFood;
    }

    function drawRect(x, y, color) {
      ctx.fillStyle = color;
      ctx.fillRect(x * tileSize, y * tileSize, tileSize - 2, tileSize - 2);
    }

    function drawGame() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      drawRect(food.x, food.y, "#f44336");

      snake.forEach((part, index) => {
        drawRect(part.x, part.y, index === 0 ? "#66bb6a" : "#4caf50");
      });

      if (gameOver) {
        ctx.fillStyle = "rgba(0,0,0,0.6)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "white";
        ctx.font = "32px Arial";
        ctx.textAlign = "center";
        ctx.fillText("Koniec gry", canvas.width / 2, canvas.height / 2 - 10);

        ctx.font = "20px Arial";
        ctx.fillText("Wynik: " + score, canvas.width / 2, canvas.height / 2 + 25);
      }
    }

    function updateGame() {
      if (gameOver) return;

      const head = { x: snake[0].x + dx, y: snake[0].y + dy };

      if (
        head.x < 0 ||
        head.x >= tileCount ||
        head.y < 0 ||
        head.y >= tileCount
      ) {
        gameOver = true;
        drawGame();
        return;
      }

      if (snake.some(part => part.x === head.x && part.y === head.y)) {
        gameOver = true;
        drawGame();
        return;
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score++;
        scoreEl.textContent = score;
        food = randomFoodPosition();
      } else {
        snake.pop();
      }

      drawGame();
    }

    document.addEventListener("keydown", (e) => {
      const key = e.key.toLowerCase();

      if ((e.key === "ArrowUp" || key === "w") && dy !== 1) {
        dx = 0;
        dy = -1;
      } else if ((e.key === "ArrowDown" || key === "s") && dy !== -1) {
        dx = 0;
        dy = 1;
      } else if ((e.key === "ArrowLeft" || key === "a") && dx !== 1) {
        dx = -1;
        dy = 0;
      } else if ((e.key === "ArrowRight" || key === "d") && dx !== -1) {
        dx = 1;
        dy = 0;
      }
    });

    restartBtn.addEventListener("click", () => {
      initGame();
      drawGame();
    });

    initGame();
    drawGame();
    setInterval(updateGame, 120);
  </script>
</body>
</html>
