<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Moja strona w internecie</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #111;
      color: white;
      text-align: center;
    }

    header {
      padding: 20px;
      background: #222;
    }

    h1 {
      color: #00ffcc;
    }

    .box {
      margin: 50px auto;
      padding: 30px;
      max-width: 500px;
      background: #1e1e1e;
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(0,255,200,0.3);
    }

    button {
      padding: 15px 25px;
      border: none;
      border-radius: 10px;
      background: #00ffcc;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #00ccaa;
    }
  </style>
</head>

<body>

<header>
  <h1>Moja pierwsza strona 🌐</h1>
</header>

<div class="box">
  <h2>Siema 👋</h2>
  <p>Ta strona działa w internecie!</p>

  <button onclick="alert('Działa! 🔥')">
    Kliknij mnie
  </button>
</div>

</body>
</html>
